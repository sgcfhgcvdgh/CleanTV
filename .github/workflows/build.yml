name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CleanTV.apk

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clean TV – latest build
          body: "Install on Fire TV with the Downloader app using: https://github.com/${{ github.repository }}/releases/download/latest/CleanTV.apk"
          files: CleanTV.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: CleanTV-apk
          path: CleanTV.apk
